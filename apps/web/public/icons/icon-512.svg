<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="#262626" stroke-width="4"/>

  <!-- Brand Accent Glow in corner -->
  <circle cx="420" cy="90" r="40" fill="#B9F227" opacity="0.15" filter="url(#glow)"/>

  <!-- GET Badge -->
  <rect x="96" y="150" width="148" height="84" rx="22" fill="#B9F227"/>
  <text x="170" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#111111" text-anchor="middle">GET</text>

  <!-- RYDE Text -->
  <text x="264" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF">RYDE</text>
  <circle cx="425" cy="210" r="9" fill="#B9F227"/>

  <!-- Electric Lime Route Path -->
  <path d="M 100 320 L 190 320 L 270 375 L 390 375" fill="none" stroke="#B9F227" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Route Points -->
  <circle cx="100" cy="320" r="16" fill="#FFFFFF"/>
  <circle cx="390" cy="375" r="16" fill="#B9F227"/>

  <!-- Subtitle Tagline -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#888888" text-anchor="middle" letter-spacing="4">YOUR RIDE. YOUR CHOICE. YOUR WAY.</text>
</svg>
