services:
  # Backend NestJS REST & WebSocket API
  - type: web
    name: getryde-api
    env: node
    plan: starter
    rootDir: apps/api
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: getryde-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: getryde-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # Frontend Next.js 15 PWA
  - type: web
    name: getryde-web
    env: node
    plan: starter
    rootDir: apps/web
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: getryde-api
          property: url

databases:
  # Managed PostgreSQL with PostGIS
  - name: getryde-db
    databaseName: getryde
    user: getryde_user
    plan: starter

  # Managed Redis Cache
  - name: getryde-redis
    ipAllowList: []
    plan: starter
